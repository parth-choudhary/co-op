name: openclaw upstream sync

on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC
  workflow_dispatch: {}

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run openclaw:sync
      - name: Open PR on drift
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(upstream): refresh openclaw diff report"
          title: "chore(upstream): weekly openclaw sync"
          body-path: .upstream-sync/last-report.md
          branch: automated/openclaw-sync
          add-paths: |
            .upstream-sync/**

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:compat
        env:
          CLAWHUB_SMOKE: '1'
